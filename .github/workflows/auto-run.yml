name: Daily Stock Analysis

on:
  workflow_dispatch:

jobs:
  analyze-stocks:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          pip install --upgrade pip
          pip install requests pyyaml pandas openpyxl

      - name: Run Core AI Analysis
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          STOCK_LIST: ${{ secrets.STOCK_LIST }}
        run: |
          echo "Executing AI-Stock-Master Core Engine..."
          python -m algorithms

      - name: Upload Stock Analysis Report
        uses: actions/upload-artifact@v4
        with:
          name: daily-ai-stock-report
          path: |
            output/
            *.html
            *.md
          if-no-files-found: warn
